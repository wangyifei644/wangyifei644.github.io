<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<base href="/birthday/">
<title>安全验证</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, "Helvetica Neue", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #f5f5f5;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding-top: 60px;
  }
  .container {
    width: 340px;
    background: #fff;
    border-radius: 8px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.12);
    overflow: hidden;
  }
  .header {
    background: #4a90d9;
    color: #fff;
    padding: 14px 16px;
    font-size: 16px;
    font-weight: 500;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .header .icon {
    width: 22px; height: 22px;
    border: 2px solid #fff;
    border-radius: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
  }
  .prompt {
    background: #4a90d9;
    color: #fff;
    padding: 0 16px 14px;
    font-size: 22px;
    font-weight: 700;
    line-height: 1.3;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 3px;
    padding: 3px;
    background: #e0e0e0;
  }
  .grid-item {
    position: relative;
    aspect-ratio: 1;
    cursor: pointer;
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
  }
  .grid-item img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transition: transform 0.15s;
  }
  .grid-item.selected img {
    transform: scale(0.85);
  }
  .grid-item .check {
    position: absolute;
    bottom: 6px;
    right: 6px;
    width: 28px;
    height: 28px;
    background: #00c853;
    border-radius: 50%;
    display: none;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-size: 18px;
    font-weight: 700;
    box-shadow: 0 1px 4px rgba(0,0,0,0.3);
  }
  .grid-item.selected .check {
    display: flex;
  }
  .footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 16px;
    border-top: 1px solid #e8e8e8;
  }
  .footer-left {
    display: flex;
    gap: 16px;
  }
  .footer-left button {
    background: none;
    border: none;
    color: #666;
    font-size: 14px;
    cursor: pointer;
    padding: 4px 0;
  }
  .btn-confirm {
    background: #4a90d9;
    color: #fff;
    border: none;
    border-radius: 4px;
    padding: 10px 28px;
    font-size: 15px;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.2s;
  }
  .btn-confirm:active {
    background: #3a7bc8;
  }
  .toast {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0.8);
    background: rgba(0,0,0,0.75);
    color: #fff;
    padding: 14px 28px;
    border-radius: 8px;
    font-size: 15px;
    opacity: 0;
    pointer-events: none;
    transition: all 0.3s;
    z-index: 100;
    text-align: center;
    max-width: 280px;
  }
  .toast.show {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1);
  }
  .loading-bar {
    height: 3px;
    background: #4a90d9;
    width: 0;
    transition: width 0.6s ease;
    position: relative;
  }
  .loading-bar.active {
    width: 100%;
  }
  /* 彩蛋弹窗 */
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    display: none;
    justify-content: center;
    align-items: center;
    z-index: 200;
    animation: fadeIn 0.4s;
  }
  .overlay.show { display: flex; }
  .surprise {
    background: #fff;
    border-radius: 16px;
    padding: 36px 28px 28px;
    text-align: center;
    max-width: 300px;
    width: 90%;
    animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }
  .surprise .emoji {
    font-size: 60px;
    margin-bottom: 16px;
  }
  .surprise .msg {
    font-size: 18px;
    color: #333;
    line-height: 1.6;
    font-weight: 500;
    margin-bottom: 20px;
  }
  .surprise .sub-msg {
    font-size: 14px;
    color: #999;
    margin-bottom: 20px;
  }
  .surprise .btn-close {
    background: linear-gradient(135deg, #ff6b6b, #ff8e53);
    color: #fff;
    border: none;
    border-radius: 24px;
    padding: 12px 40px;
    font-size: 16px;
    cursor: pointer;
    font-weight: 500;
  }
  .confetti-canvas {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 300;
  }
  @keyframes fadeIn {
    from { opacity: 0; } to { opacity: 1; }
  }
  @keyframes popIn {
    from { transform: scale(0.5); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }
  .progress {
    text-align: center;
    padding: 8px;
    font-size: 12px;
    color: #999;
    border-top: 1px solid #f0f0f0;
  }
  .progress .dots {
    display: inline-flex;
    gap: 6px;
    margin-left: 8px;
    vertical-align: middle;
  }
  .progress .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: #ddd;
    transition: background 0.3s;
  }
  .progress .dot.done {
    background: #4a90d9;
  }
  /* 生日展示页 */
  .birthday-page {
    position: fixed;
    inset: 0;
    background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 50%, #ff9a9e 100%);
    display: none;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    z-index: 400;
    animation: fadeIn 0.6s;
  }
  .birthday-page.show { display: flex; }
  .birthday-page .photo-frame {
    position: relative;
    padding: 12px;
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.15);
    margin-bottom: 24px;
    transform: rotate(-2deg);
  }
  .birthday-page .photo-frame img {
    display: block;
    max-width: 280px;
    max-height: 360px;
    border-radius: 8px;
    object-fit: cover;
  }
  .birthday-page .photo-frame .tape {
    position: absolute;
    width: 60px;
    height: 24px;
    background: rgba(255,220,100,0.7);
    top: -10px;
    left: 50%;
    transform: translateX(-50%) rotate(2deg);
    border-radius: 2px;
  }
  .birthday-page .birthday-text {
    font-size: 28px;
    font-weight: 700;
    color: #fff;
    text-shadow: 0 2px 8px rgba(0,0,0,0.2);
    margin-bottom: 8px;
    animation: pulse 2s ease-in-out infinite;
  }
  .birthday-page .birthday-sub {
    font-size: 16px;
    color: rgba(255,255,255,0.9);
    text-shadow: 0 1px 4px rgba(0,0,0,0.1);
  }
  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.05); }
  }
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <div class="icon">✓</div>
    <span>安全验证</span>
  </div>
  <div class="prompt">请选择所有的<br>过生日的人</div>
  <div class="loading-bar" id="loadingBar"></div>
  <div class="grid" id="grid"></div>
  <div class="footer">
    <div class="footer-left">
      <button id="btnSkip">我不会</button>
      <button id="btnShuffle">换一组</button>
    </div>
    <button class="btn-confirm" id="btnConfirm">确定</button>
  </div>
  <div class="progress" id="progress">
    验证进度
    <span class="dots">
      <span class="dot" id="dot0"></span>
      <span class="dot" id="dot1"></span>
      <span class="dot" id="dot2"></span>
    </span>
  </div>
</div>

<div class="toast" id="toast"></div>

<div class="overlay" id="overlay">
  <div class="surprise">
    <div class="emoji">🎂</div>
    <div class="msg">别选了～<br>今天过生日的人<br>其实是你呀！</div>
    <div class="sub-msg">🎉 生日快乐 🎉</div>
    <button class="btn-close" id="btnSurpriseClose">好叭 💕</button>
  </div>
</div>

<div class="birthday-page" id="birthdayPage">
  <div class="photo-frame">
    <div class="tape"></div>
    <img src="figure/birthday.png" alt="生日快乐">
  </div>
  <div class="birthday-text">🎂 生日快乐 🎂</div>
  <div class="birthday-sub">愿你每一天都开心 💕</div>
</div>

<canvas class="confetti-canvas" id="confettiCanvas"></canvas>

<audio id="bgMusic" preload="auto" loop>
  <source src="music/brithday.mp3" type="audio/mpeg">
</audio>

<script>
(function() {
  // 图片资源
  const girlImages = ['figure/girl1.jpg', 'figure/girl2.jpg', 'figure/girl3.jpg'];
  const catImages  = ['figure/cat1.jpg', 'figure/cat2.jpg', 'figure/cat3.jpg'];

  // 随机失败文案
  const failMessages = [
    '验证失败，请重试',
    '回答错误，再想想？',
    '选错了哦，重新选吧',
    '哎呀，差一点就对了',
    '不太对，再试一次吧',
    '这道题有点难对吧～',
    '你确定吗？再看看',
    '系统检测到异常，请重试'
  ];

  const grid = document.getElementById('grid');
  const toast = document.getElementById('toast');
  const loadingBar = document.getElementById('loadingBar');
  const overlay = document.getElementById('overlay');
  const canvas = document.getElementById('confettiCanvas');
  const bgMusic = document.getElementById('bgMusic');
  const birthdayPage = document.getElementById('birthdayPage');

  let round = 0;
  const maxRounds = 3;

  // 工具函数：洗牌
  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  // 生成当轮图片（6 张，girl 和 cat 混合打乱）
  function getImages() {
    return shuffle([...girlImages, ...catImages]);
  }

  // 更新进度点
  function updateDots() {
    for (var i = 0; i < maxRounds; i++) {
      document.getElementById('dot' + i).className = 'dot' + (i < round ? ' done' : '');
    }
  }

  // 渲染宫格
  function renderGrid() {
    const images = getImages();
    grid.innerHTML = '';
    images.forEach(src => {
      const item = document.createElement('div');
      item.className = 'grid-item';
      item.innerHTML = '<img src="' + src + '" alt="">' +
                       '<div class="check">✓</div>';
      item.addEventListener('click', function() {
        item.classList.toggle('selected');
      });
      grid.appendChild(item);
    });
  }

  // 显示 toast
  function showToast(msg, duration) {
    toast.textContent = msg;
    toast.classList.add('show');
    setTimeout(function() { toast.classList.remove('show'); }, duration || 1500);
  }

  // 模拟加载动画
  function fakeLoading(callback) {
    loadingBar.style.width = '0';
    loadingBar.classList.remove('active');
    void loadingBar.offsetWidth; // reflow
    loadingBar.classList.add('active');
    setTimeout(function() {
      loadingBar.classList.remove('active');
      loadingBar.style.width = '0';
      callback();
    }, 700);
  }

  // 确定按钮
  document.getElementById('btnConfirm').addEventListener('click', function() {
    const selected = grid.querySelectorAll('.grid-item.selected');
    if (selected.length === 0) {
      showToast('请至少选择一张图片', 1200);
      return;
    }

    round++;
    updateDots();

    if (round >= maxRounds) {
      // 最后一轮 → 彩蛋
      fakeLoading(function() {
        showSurprise();
      });
      return;
    }

    // 随机选择失败提示或静默换组
    if (Math.random() < 0.6) {
      var msg = failMessages[Math.floor(Math.random() * failMessages.length)];
      showToast(msg, 1400);
      setTimeout(function() { renderGrid(); }, 1000);
    } else {
      fakeLoading(function() { renderGrid(); });
    }
  });

  // 换一组
  document.getElementById('btnShuffle').addEventListener('click', function() {
    renderGrid();
  });

  // 我不会
  document.getElementById('btnSkip').addEventListener('click', function() {
    showToast('请继续尝试哦～', 1200);
    setTimeout(function() { renderGrid(); }, 800);
  });

  // 点"好叭"跳转生日页
  document.getElementById('btnSurpriseClose').addEventListener('click', function() {
    overlay.classList.remove('show');
    birthdayPage.classList.add('show');
    launchConfetti();
  });

  // 彩蛋
  function showSurprise() {
    overlay.classList.add('show');
    // 播放背景音乐
    bgMusic.play().catch(function() {});
    launchConfetti();
  }

  // 简易彩纸动画
  function launchConfetti() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    const ctx = canvas.getContext('2d');
    const colors = ['#ff6b6b','#ffd93d','#6bcb77','#4d96ff','#ff8e53','#c084fc','#f472b6'];
    const pieces = [];
    for (let i = 0; i < 80; i++) {
      pieces.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height - canvas.height,
        w: 6 + Math.random() * 6,
        h: 4 + Math.random() * 4,
        color: colors[Math.floor(Math.random() * colors.length)],
        vx: (Math.random() - 0.5) * 3,
        vy: 2 + Math.random() * 4,
        rot: Math.random() * Math.PI * 2,
        vr: (Math.random() - 0.5) * 0.2
      });
    }
    let frame = 0;
    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      pieces.forEach(function(p) {
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot);
        ctx.fillStyle = p.color;
        ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
        ctx.restore();
        p.x += p.vx;
        p.y += p.vy;
        p.rot += p.vr;
        p.vy += 0.05;
      });
      frame++;
      if (frame < 200) requestAnimationFrame(draw);
      else ctx.clearRect(0, 0, canvas.width, canvas.height);
    }
    draw();
  }

  // 初始化
  renderGrid();
  updateDots();
})();
</script>
</body>
</html>
